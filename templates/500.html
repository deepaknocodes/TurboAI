<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internal Server Error — Turbo AI">

    <title>500 — Internal Server Error · Turbo AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white:      #FEFEFE;
            --crystal:    #EFEFEF;
            --titanium:   #E4E4E4;
            --disco:      #D5D5D5;
            --violet:     #B8ACC0;
            --mauve:      #7F7385;

            --text:       #2a2530;
            --text-dim:   #7a727f;
            --text-faint: #b0aab5;

            --font-display: 'Syne', sans-serif;
            --font-body:    'DM Sans', sans-serif;

            --radius-xl: 28px;
            --radius-md: 14px;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--crystal);
            font-family: var(--font-body);
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dot-grid background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--disco) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 30%, rgba(239,239,239,0.75) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--white);
            border: 1px solid var(--disco);
            border-radius: var(--radius-xl);
            padding: 44px 40px 36px;
            box-shadow:
                0 2px 0 var(--titanium),
                0 12px 40px rgba(127,115,133,0.12),
                0 40px 80px rgba(127,115,133,0.07);
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(22px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--mauve), var(--violet));
            color: white;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 22px;
            text-decoration: none;
            margin: 0 auto 22px;
            box-shadow: 0 6px 18px rgba(127,115,133,0.28);
            transition: opacity 0.2s, transform 0.2s;
        }

        .logo:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .error-code {
            font-family: var(--font-display);
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--titanium);
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 14px;
            color: var(--text-faint);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 28px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--mauve), #9b8fa5);
            color: white;
            font-size: 14.5px;
            font-weight: 600;
            font-family: var(--font-body);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 18px rgba(127,115,133,0.26);
        }

        .btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(127,115,133,0.32);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 34px 24px 28px;
                border-radius: 24px;
            }

            .error-code {
                font-size: 52px;
            }

            .error-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>

    <div class="container">
        <div class="card">
            <a href="/" class="logo" aria-label="Turbo AI Home">T</a>

            <div class="error-code">500</div>
            <h1 class="error-title">Internal Server Error</h1>
            <p class="error-message">
                Something went wrong on our end. We've been notified and are
                working to fix it. Please try again in a moment.
            </p>

            <a href="/" class="btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Back to Home
            </a>
        </div>
    </div>
</body>
</html>
