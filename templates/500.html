<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error — Turbo AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white:    #FEFEFE;
            --crystal:  #EFEFEF;
            --titanium: #E4E4E4;
            --disco:    #D5D5D5;
            --violet:   #B8ACC0;
            --mauve:    #7F7385;

            --font-display: 'Syne', sans-serif;
            --font-body:    'DM Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--crystal);
            font-family: var(--font-body);
            position: relative;
            overflow: hidden;
        }

        /* Dot-grid background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--disco) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.55;
            pointer-events: none;
        }

        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 30%,
                rgba(239,239,239,0.75) 100%);
            pointer-events: none;
        }

        /* Card */
        .error-container {
            position: relative;
            z-index: 10;
            width: 420px;
            background: var(--white);
            border: 1px solid var(--disco);
            border-radius: 32px;
            padding: 52px 44px 40px;
            text-align: center;
            box-shadow:
                0 2px 0 var(--titanium),
                0 12px 40px rgba(127,115,133,0.12),
                0 40px 80px rgba(127,115,133,0.08);
            animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        /* Logo mark */
        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--mauve), var(--violet));
            color: white;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 22px rgba(127,115,133,0.28);
        }

        /* Error code */
        .error-code {
            font-family: var(--font-display);
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--mauve), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Title */
        .error-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: #2a2530;
            margin-bottom: 10px;
        }

        /* Description */
        .error-desc {
            font-size: 14.5px;
            color: #a09aa6;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Divider */
        .error-divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, var(--mauve), var(--violet));
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        /* Home button */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px 22px;
            border-radius: 16px;
            font-size: 15px;
            font-family: var(--font-body);
            font-weight: 500;
            text-decoration: none;
            background: linear-gradient(135deg, var(--mauve), #9b8fa5);
            color: white;
            box-shadow: 0 6px 18px rgba(127,115,133,0.28);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(127,115,133,0.35);
            opacity: 0.92;
        }

        @media (max-width: 480px) {
            .error-container {
                width: 92%;
                padding: 40px 28px 32px;
                border-radius: 26px;
            }
            .error-code { font-size: 56px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="error-container">
        <a href="/" class="logo-mark" aria-label="Turbo AI Home">T</a>

        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-desc">
            Something went wrong on our end. Please try again in a moment.
        </p>

        <div class="error-divider"></div>

        <a href="/" class="btn-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back to Home
        </a>
    </div>
</body>
</html>
