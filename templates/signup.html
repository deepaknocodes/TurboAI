<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Turbo AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

<div class="bg-grid"></div>

<div class="auth-container">
    <div class="auth-box">

        <!-- Logo -->
        <a href="/" class="auth-logo">T</a>

        <!-- Header -->
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Sign up to continue to Turbo AI</p>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash--{{ category }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <!-- USERNAME -->
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password">
                </div>
            </div>

            <!-- COURSE -->
            <div class="input-group">
                <label for="course">Course</label>
                <div class="input-wrap select-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
                    <select id="course" name="course_id" onchange="loadYears()" required>
                        <option value="">Select Course</option>
                        {% for course in courses %}
                            <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                    <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- YEAR -->
            <div class="input-group">
                <label for="year">Year</label>
                <div class="input-wrap select-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <select id="year" name="year_id" onchange="loadSections()" required>
                        <option value="">Select Year</option>
                    </select>
                    <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- SECTION -->
            <div class="input-group">
                <label for="section">Section</label>
                <div class="input-wrap select-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <select id="section" name="section_id" required>
                        <option value="">Select Section</option>
                    </select>
                    <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <button type="submit" class="auth-btn">
                Create Account
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>

        </form>

        <p class="bottom-text">
            Already have an account? <a href="/login">Sign In</a>
        </p>

    </div>
</div>

<script>
async function loadYears() {
    const courseId = document.getElementById("course").value;
    const yearSel  = document.getElementById("year");
    const secSel   = document.getElementById("section");

    yearSel.innerHTML = "<option value=''>Select Year</option>";
    secSel.innerHTML  = "<option value=''>Select Section</option>";

    if (!courseId) return;

    const data = await fetch(`/get-years/${courseId}`).then(r => r.json());
    data.years.forEach(y => {
        yearSel.innerHTML += `<option value="${y.id}">${y.name}</option>`;
    });
}

async function loadSections() {
    const yearId = document.getElementById("year").value;
    const secSel = document.getElementById("section");

    secSel.innerHTML = "<option value=''>Select Section</option>";
    if (!yearId) return;

    const data = await fetch(`/get-sections/${yearId}`).then(r => r.json());
    data.sections.forEach(s => {
        secSel.innerHTML += `<option value="${s.id}">Section ${s.name}</option>`;
    });
}
</script>

</body>
</html>
